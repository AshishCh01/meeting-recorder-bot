services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # The bot pool (docs/scaling-plan.md Phase C3). These are compose service
      # names, so the list is topology and belongs here rather than in a
      # hand-edited .env; `environment:` outranks `env_file:`. The backend needs
      # it for stop/delete/re-upload, which resolve a meeting's bot_host_id
      # against this list. Leave it out and bot_registry builds a pool of one
      # from MEETING_BOT_URL - which is the C3 revert, and silently drops
      # meeting-bot-2 out of rotation rather than failing.
      BOT_HOSTS: "bot-a=http://meeting-bot:3000,bot-b=http://meeting-bot-2:3000"
    networks:
      - meeting-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Broker for the transcription queue (docs/scaling-plan.md Phase A3).
    # appendonly keeps queued jobs across a Redis restart - the whole point
    # of the phase is that a restart must not lose in-flight work. Not
    # published to the host: backend and worker reach it over meeting-net at
    # redis://redis:6379, and an unauthenticated Redis on a public IP is one
    # of the more reliable ways to lose a server.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - meeting-net

  worker:
    # The backend image with a different command - no separate Dockerfile.
    # Scale it independently of the API: `docker compose -f
    # docker-compose.prod.yml up -d --scale worker=2`. That independence is
    # the second reason for the phase; the first is surviving a deploy.
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment:
      # This process's share of Supabase's 15-connection pooler cap - the
      # budget is next to db_pool_size in backend/app/config.py. env_file is
      # shared with backend, so this block is the only way the worker gets
      # different values from the same database.py; `environment:` outranks
      # env_file. 4 = worker_max_jobs, one session per job.
      #
      # Per replica: `--scale worker=2` (above) is 8 + 4 + 4 = 16, over the
      # cap. Halve DB_POOL_SIZE and WORKER_MAX_JOBS together before scaling.
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "0"
      # Not the backend's 3s. No user is waiting on a job, and a job that gives
      # up on a pool wait burns one of its arq retries for nothing.
      DB_POOL_TIMEOUT_SECONDS: "30"
      # The same list as the backend's, and it has to be character-for-character
      # identical: this container runs both the heartbeat loop that fills the
      # registry cache and the dispatcher that reads it, so a host missing here
      # is a host that never receives a meeting - with no error anywhere, just
      # one recorder sitting idle while the other queues.
      BOT_HOSTS: "bot-a=http://meeting-bot:3000,bot-b=http://meeting-bot-2:3000"
    depends_on:
      - redis
    networks:
      - meeting-net

  meeting-bot:
    build:
      context: ./meeting-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    # No host port publish, unlike docker-compose.yml's "3000:3000" - backend
    # reaches this over the internal meeting-net bridge at http://meeting-bot:3000
    # regardless of whether the port is published to the host. Publishing it
    # on a VM would expose an unauthenticated-by-network-position surface to
    # anything that can reach the host's IP; requireAuth() still gates every
    # route with BEARER_TOKEN, but there's no reason to widen the attack
    # surface for a port nothing outside this compose stack needs to call.
    # To debug from inside during an SSH session: `docker compose -f
    # docker-compose.yml -f docker-compose.prod.yml exec meeting-bot sh`,
    # then curl localhost:3000 from inside the container.
    env_file:
      - ./meeting-bot/.env
    environment:
      # Pinned rather than left to meeting-bot/.env, which both recorders share
      # and therefore cannot use to tell them apart. Both at 1 is also what
      # makes the C3 gate legible: two meetings dispatched at once *must* land
      # on different hosts, because neither host can take both.
      MAX_CONCURRENT_MEETINGS: "1"
      # This host's own identity (docs/scaling-plan.md Phase C4).
      # Container-side paths, pointing into the directory mounted
      # below - BrowserManager and AuthKeepAlive both resolve through
      # these two variables rather than the meeting-bot/ root.
      AUTH_STATE_PATH: /app/auth/auth.json
      ZOOM_AUTH_STATE_PATH: /app/auth/zoom-auth.json
    volumes:
      - ./meeting-bot/recordings:/app/recordings
      # This recorder's Google and Zoom sessions. A directory, not two
      # file mounts: AuthKeepAlive rewrites these files every 15 minutes
      # with freshly rotated cookies, and only a directory mount keeps
      # that write on the host where the next container start can still
      # read it. A missing host file would also make Docker create a
      # *directory* at /app/auth.json and fail the join confusingly.
      - ./meeting-bot/auth/bot-a:/app/auth
    # ~2gb per concurrent meeting (see docs/aws-ec2-deploy.md's VM sizing
    # section for the formula), so this covers MAX_CONCURRENT_MEETINGS=1 above.
    # Raise both together. Note each recorder gets its own 2gb, so the pair
    # below reserves 4gb of /dev/shm across the stack.
    shm_size: '2gb'
    depends_on:
      - backend
    networks:
      - meeting-net

  meeting-bot-2:
    # The second recorder (docs/scaling-plan.md Phase C3). Same image, same
    # code - "a second bot" is a second container, not a second build, so it
    # rebuilds and redeploys in lockstep with meeting-bot above.
    #
    # As of C4 it also has its own identity: auth/bot-b instead of auth/bot-a,
    # selected purely by the mount below. That is what makes this a second
    # *recorder* rather than a second process contending for one login - two
    # hosts sharing a credential means two concurrent sessions rotating the
    # same short-lived cookies against each other, and Google's rotation
    # cookies expire within roughly 10-60 minutes of being issued.
    build:
      context: ./meeting-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    # No published port, same as meeting-bot: the backend reaches this over
    # meeting-net at http://meeting-bot-2:3000, which is the URL BOT_HOSTS
    # gives for bot-b. Nothing outside the stack calls it. (docker-compose.yml
    # publishes 3001 for local debugging; a VM has no reason to.)
    env_file:
      - ./meeting-bot/.env
    environment:
      MAX_CONCURRENT_MEETINGS: "1"
      # Identical container-side paths to meeting-bot's, pointing at a
      # different host directory. The container never knows which host it is;
      # the mount below is the whole of its identity.
      AUTH_STATE_PATH: /app/auth/auth.json
      ZOOM_AUTH_STATE_PATH: /app/auth/zoom-auth.json
    volumes:
      # Its own recordings directory. A recording kept after a failed upload
      # lives on the host that made it, and POST /reupload finds it by id on
      # local disk - sharing one directory would let the wrong host answer for
      # a file, which is exactly the confusion bot_host_id exists to remove.
      - ./meeting-bot/recordings-2:/app/recordings
      # bot-b's credentials, not bot-a's. This one line is the whole of C4's
      # per-host identity at the compose level. Both files must exist before
      # this service is started: AuthHealth reports `unknown` until the first
      # keepalive cycle lands, and bot_registry.usable_for treats unknown as
      # usable, so a half-populated bot-b is dispatched meetings it cannot join.
      - ./meeting-bot/auth/bot-b:/app/auth
    shm_size: '2gb'
    depends_on:
      - backend
    networks:
      - meeting-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite bakes these into the JS bundle at build time, so they have to be
      # build args - frontend/.env as an `env_file:` would only inject runtime
      # env into the container, which nginx has no use for. Compose fills them
      # by interpolation, from the root .env beside this file or from the
      # shell; see .env.example.
      #
      # `:?` rather than a bare ${VAR}: unset, these used to interpolate to an
      # empty string with nothing but a warning, and the build would happily
      # bake VITE_API_URL="" into the bundle. That ships a frontend whose API
      # calls resolve against its own origin - it builds clean, starts clean,
      # and every request 404s through nginx's SPA fallback, so the first
      # signal is a blank page in a browser. Failing the build is the cheaper
      # end of that trade.
      #
      # Note this fires when Compose *parses* the file, not when it builds -
      # `up`, `ps`, `logs` and `down` all refuse too, including the systemd
      # unit's `up -d` on reboot. That is why the values belong in the root
      # .env, which Compose loads automatically, rather than in a shell that
      # only exists while someone is typing into it.
      args:
        VITE_API_URL: ${VITE_API_URL:?set it in the root .env - see .env.example}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set it in the root .env - see .env.example}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?set it in the root .env - see .env.example}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - meeting-net

volumes:
  redis-data:

networks:
  meeting-net:
    driver: bridge
