services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - meeting-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Broker for the transcription queue (docs/scaling-plan.md Phase A3).
    # appendonly keeps queued jobs across a Redis restart - the whole point
    # of the phase is that a restart must not lose in-flight work. Not
    # published to the host: backend and worker reach it over meeting-net at
    # redis://redis:6379, and an unauthenticated Redis on a public IP is one
    # of the more reliable ways to lose a server.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - meeting-net

  worker:
    # The backend image with a different command - no separate Dockerfile.
    # Scale it independently of the API: `docker compose -f
    # docker-compose.prod.yml up -d --scale worker=2`. That independence is
    # the second reason for the phase; the first is surviving a deploy.
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment:
      # This process's share of Supabase's 15-connection pooler cap - the
      # budget is next to db_pool_size in backend/app/config.py. env_file is
      # shared with backend, so this block is the only way the worker gets
      # different values from the same database.py; `environment:` outranks
      # env_file. 4 = worker_max_jobs, one session per job.
      #
      # Per replica: `--scale worker=2` (above) is 8 + 4 + 4 = 16, over the
      # cap. Halve DB_POOL_SIZE and WORKER_MAX_JOBS together before scaling.
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "0"
      # Not the backend's 3s. No user is waiting on a job, and a job that gives
      # up on a pool wait burns one of its arq retries for nothing.
      DB_POOL_TIMEOUT_SECONDS: "30"
    depends_on:
      - redis
    networks:
      - meeting-net

  meeting-bot:
    build:
      context: ./meeting-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    # No host port publish, unlike docker-compose.yml's "3000:3000" - backend
    # reaches this over the internal meeting-net bridge at http://meeting-bot:3000
    # regardless of whether the port is published to the host. Publishing it
    # on a VM would expose an unauthenticated-by-network-position surface to
    # anything that can reach the host's IP; requireAuth() still gates every
    # route with BEARER_TOKEN, but there's no reason to widen the attack
    # surface for a port nothing outside this compose stack needs to call.
    # To debug from inside during an SSH session: `docker compose -f
    # docker-compose.yml -f docker-compose.prod.yml exec meeting-bot sh`,
    # then curl localhost:3000 from inside the container.
    env_file:
      - ./meeting-bot/.env
    environment:
      # This host's own identity (docs/scaling-plan.md Phase C4).
      # Container-side paths, pointing into the directory mounted
      # below - BrowserManager and AuthKeepAlive both resolve through
      # these two variables rather than the meeting-bot/ root.
      AUTH_STATE_PATH: /app/auth/auth.json
      ZOOM_AUTH_STATE_PATH: /app/auth/zoom-auth.json
    volumes:
      - ./meeting-bot/recordings:/app/recordings
      # This recorder's Google and Zoom sessions. A directory, not two
      # file mounts: AuthKeepAlive rewrites these files every 15 minutes
      # with freshly rotated cookies, and only a directory mount keeps
      # that write on the host where the next container start can still
      # read it. A missing host file would also make Docker create a
      # *directory* at /app/auth.json and fail the join confusingly.
      - ./meeting-bot/auth/bot-a:/app/auth
    # Sized for MAX_CONCURRENT_MEETINGS=2 (~2gb per concurrent meeting, see
    # docs/aws-ec2-deploy.md's VM sizing section for the formula). Update this
    # alongside MAX_CONCURRENT_MEETINGS in meeting-bot/.env if you raise it.
    shm_size: '2gb'
    depends_on:
      - backend
    networks:
      - meeting-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite bakes these into the JS bundle at build time, so they have to be
      # build args - frontend/.env as an `env_file:` would only inject runtime
      # env into the container, which nginx has no use for. Compose fills them
      # by interpolation, from the root .env beside this file or from the
      # shell; see .env.example.
      #
      # `:?` rather than a bare ${VAR}: unset, these used to interpolate to an
      # empty string with nothing but a warning, and the build would happily
      # bake VITE_API_URL="" into the bundle. That ships a frontend whose API
      # calls resolve against its own origin - it builds clean, starts clean,
      # and every request 404s through nginx's SPA fallback, so the first
      # signal is a blank page in a browser. Failing the build is the cheaper
      # end of that trade.
      #
      # Note this fires when Compose *parses* the file, not when it builds -
      # `up`, `ps`, `logs` and `down` all refuse too, including the systemd
      # unit's `up -d` on reboot. That is why the values belong in the root
      # .env, which Compose loads automatically, rather than in a shell that
      # only exists while someone is typing into it.
      args:
        VITE_API_URL: ${VITE_API_URL:?set it in the root .env - see .env.example}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set it in the root .env - see .env.example}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?set it in the root .env - see .env.example}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - meeting-net

volumes:
  redis-data:

networks:
  meeting-net:
    driver: bridge
