services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env 
    volumes:
      # Live-reloads your Python code without rebuilding
      - ./backend:/app
      # Maps local recordings so the backend can process the bot's files
      - ./recordings:/app/recordings 
    networks:
      - meeting-net

  meeting-bot:
    build: 
      context: ./meeting-bot
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./meeting-bot/.env 
    volumes:
      # Ensures audio files are saved safely to the host machine
      - ./meeting-bot/recordings:/app/recordings
    # CRITICAL: Gives Chromium enough shared memory to process video/audio streams
    shm_size: '2gb'
    depends_on:
      - backend
    networks:
      - meeting-net

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      # Vite specifically uses 5173
      - "5173:5173"
    volumes:
      # Live-reloads React components
      - ./frontend:/app
      # Prevents Windows node_modules from overriding the Linux ones
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - meeting-net

networks:
  meeting-net:
    driver: bridge