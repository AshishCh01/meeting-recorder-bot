services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # The bot pool (docs/scaling-plan.md Phase C3). These are compose
      # service names, so the list is topology and belongs here rather than in
      # a hand-edited .env; `environment:` outranks `env_file:`. The backend
      # needs it for stop/delete/re-upload, which resolve a meeting's
      # bot_host_id against this list. Drop it and the pool is a pool of one
      # built from MEETING_BOT_URL - which is the C3 revert.
      BOT_HOSTS: "bot-a=http://meeting-bot:3000,bot-b=http://meeting-bot-2:3000"
    volumes:
      # Live-reloads your Python code without rebuilding
      - ./backend:/app
      # Keeps the host's venv out of the container. The bind mount above
      # would otherwise drag a Windows-layout venv/ into Linux, where
      # uvicorn --reload watches it: any pip install on the host triggers a
      # spurious server restart, and the watcher has crashed outright on it
      # ("IO error for operation on /app/venv/share"), taking the backend
      # down. Same pattern as the frontend's node_modules exclusion below.
      - /app/venv
    dns:
      # Docker Desktop's embedded DNS resolver intermittently fails to
      # resolve external hosts (e.g. the Supabase pooler) on Windows/WSL2.
      # Public resolvers as a fallback fix the "Name or service not known"
      # watchdog sweep failures.
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - meeting-net

  redis:
    image: redis:7-alpine
    # Broker for the transcription queue (docs/scaling-plan.md Phase A3).
    # No host port published - backend and worker reach it over meeting-net
    # at redis://redis:6379. Locally there is nothing to gain from exposing
    # it, and plenty to lose if the host is on a shared network.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - meeting-net

  worker:
    # Same image and same code as backend, different command. The worker is
    # not a separate service to build - it is the API image running
    # `arq app.worker.WorkerSettings` instead of uvicorn.
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment:
      # This process's share of Supabase's 15-connection pooler cap - the
      # budget is next to db_pool_size in backend/app/config.py. env_file is
      # shared with backend, so this block is the only way the worker gets
      # different values from the same database.py; `environment:` outranks
      # env_file. 4 = worker_max_jobs, one session per job.
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "0"
      # Not the backend's 3s. No user is waiting on a job, and a job that gives
      # up on a pool wait burns one of its arq retries for nothing.
      DB_POOL_TIMEOUT_SECONDS: "30"
      # Same list as the backend's, and it has to be: this container runs both
      # the heartbeat loop that fills the cache and the dispatcher that reads
      # it, so a host missing here is a host that never receives a meeting.
      BOT_HOSTS: "bot-a=http://meeting-bot:3000,bot-b=http://meeting-bot-2:3000"
    volumes:
      - ./backend:/app
      - /app/venv
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - redis
    networks:
      - meeting-net

  meeting-bot:
    build: 
      context: ./meeting-bot
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./meeting-bot/.env
    environment:
      # Pinned rather than left to .env so the pair below is symmetrical and
      # the Phase C3 gate means the same thing on every machine.
      MAX_CONCURRENT_MEETINGS: "1"
      # This host's own identity (Phase C4). The container-side path, which is
      # where the per-host directory below is mounted - BrowserManager,
      # AuthKeepAlive and both generator scripts all resolve through these two
      # variables, so setting them is all it takes to move a host onto its own
      # credentials. Unset them and everything falls back to
      # meeting-bot/auth.json, which is what a single-host install still does.
      AUTH_STATE_PATH: /app/auth/auth.json
      ZOOM_AUTH_STATE_PATH: /app/auth/zoom-auth.json
    dns:
      # Same fix as backend above: Docker Desktop's embedded DNS resolver
      # intermittently fails to resolve external hosts (e.g. Supabase Storage)
      # on Windows/WSL2. Node's fetch doesn't retry a failed DNS lookup, so an
      # unlucky resolve here means SupabaseUploader fails the recording
      # outright with "fetch failed" instead of a transient blip.
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # Ensures audio files are saved safely to the host machine
      - ./meeting-bot/recordings:/app/recordings
      # This recorder's own Google and Zoom sessions (Phase C4). A directory,
      # not two file mounts: AuthKeepAlive rewrites these files every 15
      # minutes with freshly rotated cookies, and a directory mount keeps that
      # write on the host where the next container start can still read it.
      # See meeting-bot/auth/README.md for how to generate them.
      - ./meeting-bot/auth/bot-a:/app/auth
    # CRITICAL: Gives Chromium enough shared memory to process video/audio streams.
    # 2gb was sized for one headed Chromium instance (MAX_CONCURRENT_MEETINGS=1).
    # Phase 2 (per-session PulseAudio sinks) makes MAX_CONCURRENT_MEETINGS>1 safe
    # for audio isolation, but each concurrent Chromium + its PulseAudio stream
    # adds its own shared-memory usage -- bumped to 4gb to cover testing at
    # MAX_CONCURRENT_MEETINGS=2. Scale further (or add per-container memory
    # limits) before raising the cap past that.
    shm_size: '4gb'
    depends_on:
      - backend
    networks:
      - meeting-net

  meeting-bot-2:
    # The second recorder (docs/scaling-plan.md Phase C3). Same image, same
    # code - "a second bot" is a second container, not a second build.
    #
    # As of C4 it also has its own identity: auth/bot-b instead of auth/bot-a,
    # selected purely by the two env vars below. That is what makes this a
    # second *recorder* rather than a second process contending for one login
    # - two hosts sharing a credential means two concurrent sessions rotating
    # the same short-lived cookies against each other, and Google's rotation
    # cookies expire within roughly 10-60 minutes of being issued.
    build:
      context: ./meeting-bot
      dockerfile: Dockerfile
    ports:
      # 3001 on the host; still 3000 inside, which is what BOT_HOSTS uses.
      - "3001:3000"
    env_file:
      - ./meeting-bot/.env
    environment:
      # Both recorders at 1 is what makes the C3 gate legible: two meetings
      # dispatched at once *must* land on different hosts, because neither
      # host can take both.
      MAX_CONCURRENT_MEETINGS: "1"
      # Identical paths to meeting-bot's, pointing at a different host
      # directory (Phase C4). The container never knows which host it is; the
      # mount below decides.
      AUTH_STATE_PATH: /app/auth/auth.json
      ZOOM_AUTH_STATE_PATH: /app/auth/zoom-auth.json
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # Its own recordings directory. A recording kept after a failed upload
      # lives on the host that made it, and POST /reupload finds it by id on
      # local disk - sharing one directory would let the wrong host answer for
      # a file, which is exactly the confusion bot_host_id exists to remove.
      - ./meeting-bot/recordings-2:/app/recordings
      # bot-b's credentials, not bot-a's. This one line is the whole of C4's
      # per-host identity at the compose level.
      - ./meeting-bot/auth/bot-b:/app/auth
    shm_size: '4gb'
    depends_on:
      - backend
    networks:
      - meeting-net

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      # Vite specifically uses 5173
      - "5173:5173"
    volumes:
      # Live-reloads React components
      - ./frontend:/app
      # Prevents Windows node_modules from overriding the Linux ones
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - meeting-net

volumes:
  redis-data:

networks:
  meeting-net:
    driver: bridge